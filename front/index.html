<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta name="theme-color" content="#111111" />
    <script>
      (() => {
        let stored = null;
        try { stored = localStorage.getItem('trav_theme'); } catch {}
        const theme = stored === 'dark' || stored === 'light' ? stored : (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.dataset.theme = theme;
      })();
    </script>
    <meta
      name="description"
      content="TravSeeker — descubre destinos españoles por presupuesto, temporada y afluencia."
    />
    <link rel="icon" type="image/png" href="/brand/travseeker-logo.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>TravSeeker — encuentra tu próximo lugar</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
