<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Resumen · Descripción, mapa y actividades</title><style>
@font-face{font-family:Bricolage;src:url('/fonts/bricolage-grotesque-latin.woff2');font-weight:500 800}@font-face{font-family:Manrope;src:url('/fonts/manrope-latin.woff2');font-weight:400 800}:root{--canvas:#f3f5fa;--surface:#fff;--ink:#111217;--muted:#5f6470;--line:#c6cad4;--brand:#3047f2;--sun:#ffd51f;--soft:#e9ecff;color-scheme:light}html[data-theme=dark]{--canvas:#0b0c10;--surface:#16181e;--ink:#f2f4f9;--muted:#b2b7c2;--line:#414550;--brand:#aab3ff;--soft:#282e58;color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:var(--canvas);color:var(--ink);font:15px/1.6 Manrope,sans-serif}a{color:var(--brand);text-underline-offset:4px}button{font:inherit;cursor:pointer;color:inherit}button:focus-visible,a:focus-visible,summary:focus-visible{outline:3px solid var(--brand);outline-offset:4px}h1,h2,h3,.brand{font-family:Bricolage,Manrope,sans-serif;letter-spacing:-.03em;line-height:1.15}h1{font-size:clamp(28px,3.2vw,40px);margin:0 0 18px}h2{font-size:23px;margin:0 0 14px}h3{font-size:18px;margin:0 0 8px}p{margin:0 0 18px}svg{width:20px;height:20px;flex:none}button,a{touch-action:manipulation}.lab{padding:14px max(16px,calc((100vw - 1160px)/2));background:#111217;color:#fff;display:grid;gap:12px}.lab-top{display:flex;justify-content:space-between;gap:16px;align-items:center}.lab small{display:block;color:#c6cad4;font-size:12px;line-height:1.4}.controls{display:flex;gap:8px}.controls button{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:none;color:white;border:1px solid #5f6470}.picker{display:flex;gap:8px;flex-wrap:wrap}.picker button{min-height:44px;padding:8px 16px;border:1px solid #5f6470;color:white;background:none;border-radius:999px;font-size:14px}.picker button[aria-pressed=true]{background:var(--sun);color:#171200;border-color:var(--sun)}.context{max-width:1160px;margin:auto}.site-header{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:16px 24px;border-bottom:1px solid var(--line)}.brand{font-size:24px;font-weight:800;display:flex;gap:10px;align-items:center;color:inherit;text-decoration:none}.mark{display:grid;place-items:center;width:32px;height:32px;background:var(--ink);color:var(--canvas);border-radius:50% 50% 50% 8px;font-size:15px}.context-name{font-size:13px;color:var(--muted)}.nav{display:flex;gap:24px;overflow:auto;padding-inline:24px;border-bottom:1px solid var(--line)}.nav span{display:flex;align-items:center;min-height:50px;flex:none;font-size:14px;font-weight:700;color:var(--muted)}.nav span:first-child{border-bottom:3px solid var(--brand);color:var(--ink)}main{background:var(--surface);padding:48px 40px 56px;container-type:inline-size}.description{max-width:66ch;color:var(--muted);font-size:16px;line-height:1.65}.description h1{color:var(--ink)}.description details{margin-top:8px}.description summary{display:flex;align-items:center;gap:8px;min-height:44px;font-size:14px;font-weight:700;color:var(--ink);cursor:pointer;list-style:none}.description summary::-webkit-details-marker{display:none}.description details[open] summary svg{transform:rotate(180deg)}.description details p{margin:10px 0 0;font-size:15px}.types{display:flex;gap:10px;flex-wrap:wrap}.type{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:8px 13px;border-radius:999px;background:var(--canvas);border:1px solid var(--line);font-size:13px;font-weight:700}.type svg{width:17px;height:17px;color:var(--brand)}.type-note{font-size:13px;color:var(--muted);margin:0 0 16px}.button{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:10px 16px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);text-decoration:none;font-size:14px;font-weight:700}.primary{background:var(--sun);color:#171200;border-color:var(--sun)}.map-block{min-width:0}.map-block header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px}.map-block header h2{margin:0}.location{font-size:13px;color:var(--muted);margin:0 0 12px}.map-frame{position:relative;height:240px;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:var(--canvas)}.map-frame iframe{width:100%;height:100%;display:block;border:0;pointer-events:none}.map-frame[data-active=true] iframe{pointer-events:auto}.map-cover{position:absolute;inset:0;display:grid;place-content:center;text-align:center;padding:24px;background:var(--canvas);gap:12px}.map-cover p{margin:0;color:var(--muted);font-size:13px}.map-actions{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:12px}.map-actions a{font-size:13px}.map-activate{position:absolute;bottom:30px;left:12px;border-radius:999px;min-height:44px;padding:8px 12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:700 12px Manrope;box-shadow:0 3px 12px rgb(0 0 0 / 12%)}.split{display:grid;grid-template-columns:1.15fr 1fr;gap:40px;align-items:start}.split .activity-block{grid-column:1/-1;padding-top:28px;border-top:1px solid var(--line)}.split .description{align-self:start}.editorial{display:grid;grid-template-columns:1.1fr 1fr;gap:40px;align-items:start}.editorial .description{margin-bottom:30px}.editorial .map-frame{height:350px}.compact .description{max-width:none;padding-bottom:24px;border-bottom:1px solid var(--line)}.compact-grid{display:grid;grid-template-columns:1fr 1.15fr;gap:32px;margin-top:28px}.compact .types{display:grid;grid-template-columns:1fr 1fr;gap:0 18px}.compact .type{border:0;border-bottom:1px solid var(--line);border-radius:0;background:none;padding:14px 0;font-size:14px}.compact .map-frame{height:260px}.mock-note{margin:32px 0 0;color:var(--muted);font-size:12px}body.mobile .context{max-width:390px;box-shadow:0 12px 32px rgb(0 0 0 / 12%)}body.mobile .context-name{display:none}
@container(max-width:600px){h1{font-size:29px}h2{font-size:21px}.split,.editorial,.compact-grid{grid-template-columns:minmax(0,1fr);gap:28px}.split .activity-block{grid-column:auto;padding-top:24px}.split .map-block{grid-row:2}.editorial .map-frame,.compact .map-frame{height:220px}.compact .types{grid-template-columns:minmax(0,1fr)}.editorial .description{margin-bottom:26px}.types{gap:8px}.type{padding:8px 11px}.map-block header{display:block}.map-actions{gap:12px}.map-actions .primary{flex:1}.compact-grid{margin-top:24px}.description{font-size:15px}.map-frame{height:220px}}
@media(max-width:600px){main{padding:28px 20px 40px}.site-header{padding:14px 16px}.context-name{display:none}.nav{padding-inline:16px}.lab{padding:12px}.lab-top strong{font-size:14px}.picker{gap:6px}.picker button{font-size:12px;padding-inline:12px}}

</style></head><body><div class="lab"><div class="lab-top"><div><strong>Solo el resumen · 3 propuestas</strong><small>Descripción · Ubicación · Tipos de actividades</small></div><div class="controls"><button id="mobile" aria-label="Vista móvil" aria-pressed="false"></button><button id="theme" aria-label="Cambiar tema"></button></div></div><nav class="picker" aria-label="Propuestas"><button data-view="equilibrado">1 · Equilibrado</button><button data-view="editorial">2 · Texto y mapa</button><button data-view="compacto">3 · Ficha compacta</button></nav></div><div class="context"><header class="site-header"><a class="brand" href="/?lang=es"><span class="mark">T</span>TravSeeker</a><span class="context-name">Costa del Garraf</span></header><nav class="nav" aria-label="Contexto del destino"><span>Resumen</span><span>Cuándo ir</span><span>Imprescindibles</span><span>Bases</span></nav><main id="preview"></main></div>
<script>
const data={"description": "La Costa del Garraf, situada a las puertas de Barcelona, es un enclave privilegiado donde el macizo montañoso de su Parque Natural se funde con el Mediterráneo, ofreciendo desde calas recónditas hasta el vibrante ambiente modernista de Sitges. Este litoral equilibra a la perfección el cosmopolitismo cultural con la tradición marinera de núcleos como Vilanova i la Geltrú, consolidándose como un destino polifacético que combina rutas de senderismo, náutica y una agenda de eventos de primer nivel. Es, en esencia, un refugio de arena dorada y naturaleza escarpada ideal para quienes buscan una escapada con identidad propia y proximidad urbana.", "short": "La Costa del Garraf, situada a las puertas de Barcelona, es un enclave privilegiado donde el macizo montañoso de su Parque Natural se funde con el Mediterráneo, ofreciendo desde calas recónditas hasta el vibrante ambiente modernista de Sitges.", "types": ["Deportes acuáticos", "Enoturismo", "Familiar", "Gastronomía", "Ocio", "Patrimonio Modernista", "Relax y bienestar", "Senderismo"], "lat": 41.25, "lng": 1.9};
const paths={arrow:'<path d="M5 12h14m-6-6 6 6-6 6"/>',down:'<path d="m6 9 6 6 6-6"/>',map:'<path d="m3 5 6-2 6 2 6-2v16l-6 2-6-2-6 2zM9 3v16m6-14v16"/>',phone:'<rect x="6" y="2" width="12" height="20" rx="2"/><path d="M11 18h2"/>',moon:'<path d="M20 13A8 8 0 0 1 11 4a8 8 0 1 0 9 9Z"/>',waves:'<path d="M2 8q3-3 5 0t5 0 5 0 5 0M2 13q3-3 5 0t5 0 5 0 5 0M2 18q3-3 5 0t5 0 5 0 5 0"/>',wine:'<path d="M8 3h8l1 6a5 5 0 0 1-10 0zM12 14v7m-4 0h8M7 9h10"/>',users:'<circle cx="9" cy="7" r="3"/><path d="M3 21v-3a6 6 0 0 1 12 0v3m2-16a3 3 0 0 1 0 6m1 4a5 5 0 0 1 3 6"/>',food:'<path d="M4 3v7m4-7v7M6 3v18m-2-11h4M17 3v18m0-18c-4 5-4 10 0 10"/>',landmark:'<path d="m3 9 9-6 9 6M3 9h18M5 10v8m5-8v8m4-8v8m5-8v8M3 21h18"/>',walk:'<circle cx="13" cy="4" r="2"/><path d="m8 12 3-4 4 5h4M11 8l-1 9-4 5m4-5 6 5"/>',leaf:'<path d="M20 3C5 3 3 9 5 16s15 2 15-13ZM5 20l10-10"/>',spark:'<path d="m12 3 2.5 6.5L21 12l-6.5 2.5L12 21l-2.5-6.5L3 12l6.5-2.5z"/>'};
const icon=k=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${paths[k]}</svg>`;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const iconTypes=['waves','wine','users','food','spark','landmark','leaf','walk'];
const description=()=>`<div class="description"><h1>Sobre Costa del Garraf</h1><p>${esc(data.short)}</p><details><summary>Leer la descripción completa ${icon('down')}</summary><p>${esc(data.description)}</p></details></div>`;
const activities=()=>`<section class="activity-block"><h2>Qué tipo de planes encontrarás</h2><div class="types">${data.types.map((t,i)=>`<span class="type">${icon(iconTypes[i])}${esc(t)}</span>`).join('')}</div></section>`;
const mapUrl=`https://www.openstreetmap.org/?mlat=${data.lat}&mlon=${data.lng}#map=11/${data.lat}/${data.lng}`;
const embed=`https://www.openstreetmap.org/export/embed.html?bbox=${data.lng-.28}%2C${data.lat-.17}%2C${data.lng+.28}%2C${data.lat+.17}&layer=mapnik&marker=${data.lat}%2C${data.lng}`;
const map=()=>`<section class="map-block"><header><h2>Dónde está</h2></header><p class="location">Costa del Garraf · Barcelona, Cataluña</p><div class="map-frame"><div class="map-cover">${icon('map')}<button class="button" data-load-map>Cargar mapa</button><p>Vista de la zona con OpenStreetMap</p></div></div><div class="map-actions"><a href="${mapUrl}" target="_blank" rel="noopener">Abrir mapa ${icon('arrow')}</a><a class="button primary" href="https://www.google.com/maps/dir/?api=1&destination=${data.lat},${data.lng}" target="_blank" rel="noopener">Cómo llegar ${icon('arrow')}</a></div></section>`;
let view=new URLSearchParams(location.search).get('vista')||'equilibrado';if(!['equilibrado','editorial','compacto'].includes(view))view='equilibrado';let mapLoaded=false;
function loadMap(){mapLoaded=true;const frame=document.querySelector('.map-frame');frame.innerHTML=`<iframe title="Mapa de Costa del Garraf" src="${embed}" loading="eager" referrerpolicy="no-referrer"></iframe><button class="map-activate" data-activate-map>Explorar mapa</button>`;}
function render(){document.querySelectorAll('[data-view]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.view===view)));let html='';if(view==='equilibrado')html=`<section class="split">${description()}${map()}${activities()}</section>`;if(view==='editorial')html=`<section class="editorial"><div>${description()}${activities()}</div>${map()}</section>`;if(view==='compacto')html=`<section class="compact">${description()}<div class="compact-grid">${activities()}${map()}</div></section>`;document.querySelector('#preview').innerHTML=html+'<p class="mock-note">Propuesta para sustituir únicamente la sección de resumen. Los datos corresponden a Costa del Garraf.</p>';if(mapLoaded)loadMap();}
document.querySelector('.picker').onclick=e=>{const b=e.target.closest('[data-view]');if(!b)return;view=b.dataset.view;const url=new URL(location);url.searchParams.set('vista',view);history.replaceState({},'',url);render()};document.querySelector('#preview').onclick=e=>{if(e.target.closest('[data-load-map]'))loadMap();const b=e.target.closest('[data-activate-map]');if(b){const frame=b.closest('.map-frame');const active=frame.dataset.active!=='true';frame.dataset.active=String(active);b.textContent=active?'Bloquear mapa':'Explorar mapa';b.setAttribute('aria-pressed',String(active));}};
document.querySelector('#theme').innerHTML=icon('moon');document.querySelector('#theme').onclick=()=>document.documentElement.dataset.theme=document.documentElement.dataset.theme==='dark'?'light':'dark';document.querySelector('#mobile').innerHTML=icon('phone');document.querySelector('#mobile').onclick=e=>{document.body.classList.toggle('mobile');e.currentTarget.setAttribute('aria-pressed',String(document.body.classList.contains('mobile')))};if(new URLSearchParams(location.search).get('movil')==='1'){document.body.classList.add('mobile');document.querySelector('#mobile').setAttribute('aria-pressed','true')}render();
</script></body></html>
