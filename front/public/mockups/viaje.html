<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tu viaje · TravSeeker · Propuestas</title>
<style>
@font-face{font-family:Bricolage;src:url('/fonts/bricolage-grotesque-latin.woff2')}@font-face{font-family:Manrope;src:url('/fonts/manrope-latin.woff2')}
:root{--canvas:#f3f5fa;--surface:#fff;--ink:#111217;--muted:#5f6470;--line:#c6cad4;--brand:#3047f2;--soft:#dfe3ff;--sun:#ffd51f}html[data-theme=dark]{--canvas:#0b0c10;--surface:#16181e;--ink:#f2f4f9;--muted:#b2b7c2;--line:#414550;--brand:#8794ff;--soft:#282e58}*{box-sizing:border-box}body{margin:0;background:var(--canvas);color:var(--ink);font:14px Manrope,sans-serif}button,input,select,textarea{font:inherit;color:inherit}button,a,input,select,textarea{outline-offset:4px}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--brand)}button{cursor:pointer}button:disabled{opacity:.5;cursor:default}button{border:1px solid var(--line);border-radius:999px;background:var(--surface);padding:11px 17px;font-weight:700}button:hover{border-color:var(--brand)}.primary{background:var(--brand);color:white;border-color:var(--brand)}html[data-theme=dark] .primary{background:#3047f2;border-color:#3047f2}.dark{background:var(--ink);color:var(--canvas)}.subtle{border:0;background:none;padding:8px;color:var(--muted)}h1,h2,h3,.logo{font-family:Bricolage,sans-serif;letter-spacing:-.04em}h1{font-size:clamp(38px,5vw,68px);line-height:1;margin:12px 0 18px}h2{font-size:32px;margin:0 0 12px}h3{font-size:22px;margin:0 0 8px}p{line-height:1.6}.muted,small{color:var(--muted)}.kicker{font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:800}.top{height:72px;display:flex;align-items:center;justify-content:space-between;padding:0 4vw;border-bottom:1px solid var(--line);background:var(--surface)}.logo{font-size:26px;font-weight:800}.logo em{color:var(--brand);font-style:normal}.top nav{display:flex;gap:24px}.top nav span{color:var(--muted)}.top nav b{color:var(--brand)}.avatar{width:34px;height:34px;border-radius:50%;background:var(--sun);color:#111217;display:grid;place-items:center;font-weight:800}.lab{padding:12px 4vw;background:var(--ink);color:var(--canvas);display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}.lab strong{font-size:12px}.variants{display:flex;gap:5px;flex-wrap:wrap}.variants button{font-size:12px;background:transparent;color:inherit;border-color:var(--muted);padding:8px 12px}.variants button[aria-pressed=true]{background:var(--sun);color:#111217;border-color:var(--sun)}.lab-actions{display:flex;gap:8px}.lab-actions button{background:none;color:inherit;font-size:11px;padding:7px 10px}.wrap{max-width:1600px;margin:auto;padding:28px 4vw 60px}.breadcrumb{font-size:12px;color:var(--muted);margin-bottom:24px}.heading{display:flex;justify-content:space-between;align-items:center;gap:20px}.facts{display:flex;gap:18px;flex-wrap:wrap;color:var(--muted)}.facts span{white-space:nowrap}.actions{display:flex;gap:8px;flex-wrap:wrap}.cover{position:relative;overflow:hidden;border-radius:20px;background:#10243c;color:white;padding:48px;margin-bottom:24px;min-height:300px}.cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.55}.cover:after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,rgba(6,17,32,.9),rgba(6,17,32,.12))}.cover>div{position:relative;z-index:1}.cover .facts{color:#fff}.cover .kicker{color:var(--sun)}.section-nav{display:flex;gap:32px;margin:28px 0;border-bottom:1px solid var(--line);overflow:auto}.section-nav button{background:none;border:0;border-bottom:3px solid transparent;border-radius:0;padding:15px 0;white-space:nowrap;color:var(--muted)}.section-nav button[aria-selected=true]{border-color:var(--brand);color:var(--ink)}.layout{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:30px;align-items:start}.planner{grid-template-columns:220px minmax(0,1fr) 260px;gap:24px}.dayrail{display:flex;gap:10px;margin:0 0 24px;overflow:auto;padding:3px}.dayrail button{border-radius:12px;text-align:left;min-width:136px;padding:14px 18px}.dayrail button b,.dayrail button small{display:block}.dayrail button small{margin-top:6px;font-size:11px}.dayrail button[aria-pressed=true]{background:var(--brand);color:white;border-color:var(--brand)}.dayrail button[aria-pressed=true] small{color:#e2e5ff}.planner .dayrail{flex-direction:column}.planner .dayrail button{width:100%}.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px;margin-bottom:18px}.day{padding:0;overflow:hidden}.day-head{padding:24px;display:flex;justify-content:space-between;align-items:center;gap:12px;border-bottom:1px solid var(--line)}.day-head h2{margin:6px 0;font-size:28px}.badge{display:inline-block;background:var(--soft);color:var(--brand);border-radius:30px;padding:6px 10px;font-size:11px;font-weight:800}.activity{padding:20px 24px;border-bottom:1px solid var(--line);display:grid;grid-template-columns:48px minmax(0,1fr) auto;gap:14px;align-items:start}.activity h3{font-family:Manrope;font-size:15px;letter-spacing:0;margin:2px 0 7px}.activity p{font-size:12px;margin:0;color:var(--muted)}.activity-icon{background:var(--soft);color:var(--brand);height:44px;width:44px;border-radius:12px;display:grid;place-items:center;font-size:22px}.activity-actions{display:flex;gap:5px;align-items:center}.activity-actions select{max-width:128px;border:1px solid var(--line);padding:7px;border-radius:8px;background:var(--surface);font-size:11px}.activity-actions button{border:0;padding:7px;background:none;font-size:18px;color:var(--muted)}.notes{padding:22px 24px}.notes label{font-size:12px;font-weight:800;display:block;margin-bottom:8px}.notes textarea{width:100%;resize:vertical;min-height:70px;border:1px solid var(--line);border-radius:10px;padding:12px;background:var(--canvas);font-size:13px}.day-bottom{padding:0 24px 22px;display:flex;gap:10px;flex-wrap:wrap}.savebar{margin-top:22px;position:sticky;bottom:16px;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:13px 18px;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:0 8px 30px #0001;z-index:3}.savebar span{font-size:12px}.side-title{font-size:12px;font-weight:800;margin:0 0 14px}.route{border-left:2px solid var(--brand);padding-left:16px;display:grid;gap:16px}.route b{display:block}.route small{font-size:11px}.budget{font-family:Bricolage;font-size:34px;margin:14px 0 5px}.budget small{font:12px Manrope}.money{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line);font-size:12px}.group{display:flex;gap:6px;margin:12px 0}.group .avatar:nth-child(2){background:var(--soft);color:var(--brand)}.side img,.destination img{width:100%;height:135px;object-fit:cover;border-radius:10px}.side .primary{width:100%;margin-top:12px}.segment{color:var(--muted);margin:18px 0 24px 24px;font-size:12px}.segment:before{content:'↓';margin-right:14px;color:var(--brand)}.empty{text-align:center;padding:35px;color:var(--muted)}.empty strong{display:block;color:var(--ink);margin:10px}.dest-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}.destination button{margin-top:10px}.overview{display:grid;grid-template-columns:1.3fr 1fr;gap:24px}.overview .card:first-child{background:var(--soft)}.overview li{margin:16px 0}.notice{padding:12px 16px;margin:0 0 20px;border-radius:10px;background:var(--soft);font-size:12px}.error{background:#ffe5e5;color:#962c2c}.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--canvas);padding:14px 22px;border-radius:12px;z-index:20;box-shadow:0 8px 30px #0003}.toast[hidden]{display:none}dialog{border:1px solid var(--line);border-radius:18px;background:var(--surface);color:var(--ink);max-width:520px;width:calc(100% - 32px);padding:28px}dialog::backdrop{background:#05071499}dialog form{display:grid;gap:14px}dialog label{display:grid;gap:7px;font-size:12px;font-weight:800}dialog input,dialog select{padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--canvas);width:100%}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:12px}.demo-label{font-size:11px;color:var(--muted);margin-top:20px}.planner .side .card{padding:16px}.planner h1{font-size:46px}.timeline-counter{font:800 13px Manrope;color:var(--brand);margin-right:12px}
@media(min-width:1100px){.side{position:sticky;top:20px}.planner>aside:first-child{position:sticky;top:20px}}@media(max-width:1050px){.planner{grid-template-columns:180px minmax(0,1fr)}.planner .side{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr;gap:18px}.layout:not(.planner){grid-template-columns:minmax(0,1fr) 250px}.top nav{gap:12px}}@media(max-width:760px){.top{height:62px;padding:0 20px}.top nav{display:none}.wrap{padding:22px 18px 50px}.lab{padding:12px 18px}.lab-actions{flex-wrap:wrap}.heading{display:block}.heading>.actions{margin-top:20px}h1,.planner h1{font-size:40px}.facts{gap:10px;font-size:12px}.layout,.layout:not(.planner),.planner{display:block}.planner .dayrail{flex-direction:row}.planner .dayrail button{width:auto}.side{margin-top:24px}.planner .side{display:block}.cover{padding:28px;min-height:290px;margin-top:5px}.cover h1{font-size:42px}.section-nav{gap:24px;margin:22px 0}.activity{grid-template-columns:40px minmax(0,1fr);padding:18px}.activity-icon{width:38px;height:38px}.activity-actions{grid-column:2}.day-head{padding:18px;align-items:start}.day-head h2{font-size:24px}.day-head .badge{font-size:10px}.notes{padding:18px}.day-bottom{padding:0 18px 18px}.dest-grid,.overview{grid-template-columns:1fr}.savebar{bottom:8px;padding:12px}.savebar button{padding:10px 13px;font-size:12px}.savebar span{font-size:11px}.breadcrumb{margin-bottom:18px}.lab strong{width:100%}}
@media(prefers-reduced-motion:no-preference){button{transition:background 160ms ease-out,border-color 160ms ease-out}}
</style></head><body>
<header class="top"><span class="logo">trav<em>seeker</em><span style="color:var(--brand)">.</span></span><nav aria-label="Navegación principal"><span>Descubrir</span><span>Destinos</span><b>Mis viajes</b></nav><span class="avatar" aria-label="Perfil de Joan">J</span></header>
<div class="lab"><strong>EXPLORACIÓN · DATOS DE DEMOSTRACIÓN</strong><div class="variants" aria-label="Propuestas"><button data-variant="agenda">Agenda del viaje</button><button data-variant="ruta">Ruta continua</button><button data-variant="panel">Panel de planificación</button></div><div class="lab-actions"><button id="theme">Cambiar tema</button><button id="error">Simular fallo</button><button id="reset">Restablecer demo</button></div></div>
<main class="wrap" id="app"></main><div class="toast" role="status" hidden></div>
<dialog id="modal"><form id="modal-form"></form></dialog>
<script>
const photos={asturias:'/mockups/paisaje-costa.jpg',costa:'/mockups/paisaje-costa.jpg'};
const initial=[{destination:'Asturias',base:'Cangas de Onís',date:'Lun, 12 oct',activities:['Lagos de Covadonga','Paseo por Cangas de Onís'],notes:'Llegar temprano a los lagos. Consultar el acceso antes de salir.'},{destination:'Asturias',base:'Llanes',date:'Mar, 13 oct',activities:['Sendero de la costa','Casco antiguo de Llanes'],notes:''},{destination:'Cantabria',base:'Santillana del Mar',date:'Mié, 14 oct',activities:['Paseo por Santillana del Mar'],notes:'Dejar la tarde libre para explorar.'},{destination:'Cantabria',base:'Comillas',date:'Jue, 15 oct',activities:[],notes:''}];
const clone=x=>JSON.parse(JSON.stringify(x));let days=clone(initial),saved=clone(initial),variant=new URLSearchParams(location.search).get('vista')||'agenda',selected=0,section='itinerario',simulateError=false,message='';if(!['agenda','ruta','panel'].includes(variant))variant='agenda';try{const stored=JSON.parse(localStorage.getItem('travseeker-trip-mockup-v1'));if(Array.isArray(stored)&&stored.length===4&&stored.every(d=>typeof d.destination==='string'&&Array.isArray(d.activities)&&d.activities.every(a=>typeof a==='string')&&typeof d.notes==='string')){days=clone(stored);saved=clone(stored)}}catch{}
const esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const dirty=()=>JSON.stringify(days)!==JSON.stringify(saved);const total=()=>days.reduce((n,d)=>n+d.activities.length,0);const toast=text=>{let t=document.querySelector('.toast');t.textContent=text;t.hidden=false;clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>t.hidden=true,3000)};
function facts(){return '<div class="facts"><span>▦ 12–15 octubre 2026</span><span>♙ 2 viajeros</span><span>⌖ 2 destinos</span><span>4 días · '+total()+' actividades</span></div>'}
function rail(){return '<div class="dayrail" aria-label="Seleccionar día">'+days.map((d,i)=>`<button data-day="${i}" aria-pressed="${i===selected}"><b>Día ${i+1} · ${esc(d.base)}</b><small>${esc(d.date)} · ${d.activities.length} actividades</small></button>`).join('')+'</div>'}
function dayCard(i){const d=days[i];return `<article class="card day" id="dia-${i+1}"><header class="day-head"><div><span class="kicker"><span class="timeline-counter">${String(i+1).padStart(2,'0')}</span>${esc(d.date)}</span><h2>${esc(d.base)}</h2><small>${esc(d.destination)} · Tu día, a tu ritmo</small></div><span class="badge">${d.activities.length} actividades</span></header>${d.activities.length?d.activities.map((a,j)=>`<div class="activity"><span class="activity-icon" aria-hidden="true">${j%2?'⌖':'◇'}</span><div><h3>${esc(a)}</h3><p>Guardada en el día ${i+1} · ${esc(d.destination)}</p></div><div class="activity-actions"><select aria-label="Mover ${esc(a)} a otro día" data-move="${i}:${j}"><option value="">Mover a…</option>${days.map((next,k)=>k!==i&&next.destination===d.destination?`<option value="${k}">Día ${k+1} · ${esc(next.base)}</option>`:'').join('')}</select><button data-remove="${i}:${j}" aria-label="Quitar ${esc(a)}">×</button></div></div>`).join(''):'<div class="empty"><span style="font-size:30px">＋</span><strong>Un día por descubrir</strong>Añade una actividad o deja espacio para improvisar.</div>'}<div class="notes"><label for="notes-${i}">Notas del día</label><textarea id="notes-${i}" data-notes="${i}" placeholder="Ideas, reservas o algo que recordar…">${esc(d.notes)}</textarea></div><div class="day-bottom"><button class="primary" data-add="${i}">＋ Añadir actividad</button><button data-edit="${i}">Editar día</button></div></article>`}
function sidebar(){return `<aside class="side"><article class="card"><p class="side-title">Tu ruta por el norte</p><div class="route"><div><b>Asturias</b><small>Días 1–2 · Cangas de Onís y Llanes</small></div><div><b>Cantabria</b><small>Días 3–4 · Santillana y Comillas</small></div></div></article><article class="card"><p class="side-title">Presupuesto orientativo</p><div class="budget">640 € <small>/ persona</small></div><p class="muted" style="font-size:12px">4 días · 3 noches · 2 viajeros</p><div class="money"><span>Alojamiento</span><b>270 €</b></div><div class="money"><span>Comida</span><b>160 €</b></div><div class="money"><span>Transporte y actividades</span><b>210 €</b></div><p class="muted" style="font-size:11px">Estimación de demostración, no gastos reales.</p></article>${variant==='panel'?`<article class="card"><p class="side-title">Ideas para ${esc(days[selected].destination)}</p><img src="${photos.costa}" alt="Paisaje junto al agua"><h3 style="margin-top:12px">Haz sitio para explorar</h3><p class="muted" style="font-size:12px">Añade una experiencia al día que estás preparando.</p><button class="primary" data-add="${selected}">＋ Añadir al día ${selected+1}</button></article>`:`<article class="card"><p class="side-title">Compañeros de viaje</p><div class="group"><span class="avatar">J</span><span class="avatar">M</span></div><p class="muted" style="font-size:12px">Joan y Marta · 2 viajeros</p><button data-share>Compartir viaje</button></article>`}</aside>`}
function bar(){return `<div class="savebar"><span id="save-status">${dirty()?'● Cambios pendientes':'✓ Todo guardado en esta demo'}</span><button class="primary" id="save" ${dirty()?'':'disabled'}>Guardar cambios</button></div>`}
function render(){document.querySelectorAll('[data-variant]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.variant===variant));document.querySelector('#error').setAttribute('aria-pressed',simulateError);document.querySelector('#error').textContent=simulateError?'Fallo activado':'Simular fallo';let header=`<div class="heading"><div><span class="kicker" style="color:var(--brand)">Tu próximo viaje</span><h1>Cuatro días por el norte.</h1>${facts()}</div><div class="actions"><button data-share>↗ Compartir</button><button id="export">↓ Exportar</button></div></div>`;if(variant==='ruta')header=`<section class="cover"><img src="${photos.asturias}" alt="Paisaje de montaña de referencia"><div><span class="kicker">Asturias + Cantabria · Tu ruta</span><h1>Cuatro días por el norte.</h1><p>Montañas, pueblos y un poco de mar.</p>${facts()}</div></section><div class="actions"><button data-share>↗ Compartir</button><button id="export">↓ Exportar</button></div>`;let content='';if(section==='itinerario'){content=variant==='panel'?`<div class="layout planner"><aside><p class="side-title">Los días de tu viaje</p>${rail()}<p class="demo-label">Elige un día para organizar sus actividades.</p></aside><div>${dayCard(selected)}${bar()}</div>${sidebar()}</div>`:`<div class="layout"><div>${variant==='agenda'?rail()+dayCard(selected):days.map((d,i)=>dayCard(i)+(i<days.length-1?'<div class="segment">Siguiente parada · '+esc(days[i+1].base)+'</div>':'')).join('')}${bar()}</div>${sidebar()}</div>`}else if(section==='resumen'){content=`<div class="overview"><article class="card"><span class="kicker">Lo que queda por preparar</span><h2>Un viaje con espacio para ti.</h2><p>Las fechas y los destinos están preparados. Puedes seguir dando forma a tus días.</p><ul>${days.filter(d=>!d.activities.length).map(d=>'<li>Añadir ideas para '+esc(d.base)+'</li>').join('')||'<li>Revisar las actividades de cada día</li>'}<li>Revisar el presupuesto orientativo</li></ul><button class="primary" data-section="itinerario">Continuar con el itinerario</button><p class="muted">Compartir es opcional. Tu viaje puede seguir siendo privado.</p></article>${sidebar()}</div>`}else{content=`<div class="dest-grid">${['Asturias','Cantabria'].map((name,i)=>`<article class="card destination"><img src="${i?photos.costa:photos.asturias}" alt="Paisaje de referencia para ${name}"><p class="kicker">${i?'Días 3–4':'Días 1–2'}</p><h2>${name}</h2><p class="muted">${i?'Santillana del Mar · Comillas':'Cangas de Onís · Llanes'}</p><button data-day="${i?2:0}">Ver días de ${name}</button></article>`).join('')}<article class="card"><h3>Una ruta a tu medida</h3><p class="muted">Las actividades se organizan dentro de los días de cada destino.</p><button data-section="itinerario">Organizar actividades</button></article></div>`}document.querySelector('#app').innerHTML=`<div class="breadcrumb">Mis viajes / Cuatro días por el norte</div>${header}<nav class="section-nav" role="tablist" aria-label="Secciones del viaje">${[['itinerario','Día a día'],['resumen','Resumen'],['destinos','Destinos']].map(([id,label])=>`<button role="tab" aria-selected="${section===id}" data-section="${id}">${label}</button>`).join('')}</nav>${message?`<div class="notice error" role="alert">${esc(message)}</div>`:''}${content}<p class="demo-label">Prototipo interactivo · Los cambios se guardan solo en este navegador. Fotografías de referencia. No modifica tus viajes reales.</p>`;bind()}
function updateStatus(){const status=document.querySelector('#save-status');if(status)status.textContent=dirty()?'● Cambios pendientes':'✓ Todo guardado en esta demo';const b=document.querySelector('#save');if(b)b.disabled=!dirty()}
function modal(title,fields,submit){const dialog=document.querySelector('#modal'),form=document.querySelector('#modal-form');form.innerHTML=`<h2>${title}</h2>${fields}<div class="modal-actions"><button type="button" id="cancel">Cancelar</button><button class="primary">${submit}</button></div>`;form.querySelector('#cancel').onclick=()=>dialog.close();dialog.showModal();return form}
function add(i){const form=modal('Añadir al día '+(i+1),`<p class="muted">${esc(days[i].base)} · ${esc(days[i].date)}</p><label>Actividad<input name="activity" required maxlength="100" placeholder="Por ejemplo: Mirador del Fitu" list="ideas"></label><datalist id="ideas"><option value="Mirador del Fitu"><option value="Paseo por la playa"><option value="Visita al mercado local"></datalist>`,'Añadir actividad');form.onsubmit=e=>{e.preventDefault();const name=new FormData(form).get('activity').trim();if(!name)return;if(days[i].activities.includes(name)){toast('Esta actividad ya está en este día');return}days[i].activities.push(name);message='';document.querySelector('#modal').close();render();toast('Actividad añadida al día '+(i+1))}}
function bind(){document.querySelectorAll('[data-section]').forEach(b=>b.onclick=()=>{section=b.dataset.section;render()});document.querySelectorAll('[data-day]').forEach(b=>b.onclick=()=>{selected=Number(b.dataset.day);section='itinerario';render();if(variant==='ruta')document.querySelector('#dia-'+(selected+1)).scrollIntoView({block:'start'})});document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>add(Number(b.dataset.add)));document.querySelectorAll('[data-notes]').forEach(t=>t.oninput=()=>{days[Number(t.dataset.notes)].notes=t.value;updateStatus()});document.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{const[i,j]=b.dataset.remove.split(':').map(Number);days[i].activities.splice(j,1);render();toast('Actividad quitada del día '+(i+1))});document.querySelectorAll('[data-move]').forEach(s=>s.onchange=()=>{if(s.value==='')return;const[i,j]=s.dataset.move.split(':').map(Number),target=Number(s.value),name=days[i].activities[j];if(!days[target].activities.includes(name))days[target].activities.push(name);days[i].activities.splice(j,1);selected=target;render();toast('Actividad movida al día '+(target+1))});document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{const i=Number(b.dataset.edit),form=modal('Editar día '+(i+1),`<label>Municipio base<input name="base" value="${esc(days[i].base)}" required maxlength="80"></label><p class="muted">Destino: ${esc(days[i].destination)} · ${esc(days[i].date)}</p>`,'Aplicar');form.onsubmit=e=>{e.preventDefault();const base=new FormData(form).get('base').trim();if(!base)return;days[i].base=base;document.querySelector('#modal').close();render()}});document.querySelectorAll('[data-share]').forEach(b=>b.onclick=()=>{const form=modal('Compartir viaje','<p>En el viaje real podrás invitar a editores o lectores y gestionar el enlace público.</p><p class="notice">Esta demo no publica datos ni envía invitaciones.</p>','Entendido');form.onsubmit=e=>{e.preventDefault();document.querySelector('#modal').close()}});const exp=document.querySelector('#export');if(exp)exp.onclick=()=>{const blob=new Blob([days.map((d,i)=>`Día ${i+1} · ${d.base}\n${d.activities.join('\n')}\nNotas: ${d.notes}`).join('\n\n')],{type:'text/plain;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='viaje-demo.txt';a.click();URL.revokeObjectURL(url);toast('Itinerario de demostración exportado')};const save=document.querySelector('#save');if(save)save.onclick=()=>{if(simulateError){message='No se pudo guardar. Tus cambios siguen aquí; desactiva “Fallo activado” y vuelve a intentarlo.';render();return}try{localStorage.setItem('travseeker-trip-mockup-v1',JSON.stringify(days));saved=clone(days);message='';render();toast('Cambios guardados en este navegador')}catch{message='No se pudo guardar en este navegador. Tus cambios siguen disponibles en esta sesión.';render()}}}
document.querySelectorAll('[data-variant]').forEach(b=>b.onclick=()=>{variant=b.dataset.variant;history.replaceState(null,'','?vista='+variant);render()});document.querySelector('#theme').onclick=()=>{document.documentElement.dataset.theme=document.documentElement.dataset.theme==='dark'?'light':'dark'};document.querySelector('#error').onclick=()=>{simulateError=!simulateError;if(!simulateError)message='';render();toast(simulateError?'El próximo guardado simulará un fallo':'Guardado disponible')};document.querySelector('#reset').onclick=()=>{if(dirty()&&!confirm('¿Restablecer la demo y descartar los cambios?'))return;days=clone(initial);saved=clone(initial);try{localStorage.removeItem('travseeker-trip-mockup-v1')}catch{}selected=0;message='';simulateError=false;render();toast('Demo restablecida')};window.addEventListener('beforeunload',e=>{if(dirty())e.preventDefault()});render();
</script></body></html>
